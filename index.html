<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maya · Savings Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23F0C060'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='38' font-family='Arial'>💰</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #080B12;
      --bg2:       #0E1420;
      --bg3:       #141B2D;
      --glass:     rgba(20,27,45,0.7);
      --border:    rgba(255,255,255,0.07);
      --border-hi: rgba(255,90,130,0.35);
      --pink:      #FF5A82;
      --pink-glow: rgba(255,90,130,0.25);
      --cyan:      #00E5D4;
      --cyan-glow: rgba(0,229,212,0.2);
      --gold:      #F5C84A;
      --gold-glow: rgba(245,200,74,0.2);
      --red:       #FF4D6A;
      --green:     #2BFFC0;
      --text:      #EEF0FF;
      --text2:     #8B93B8;
      --text3:     #4E5680;
      --radius:    18px;
      --shadow:    0 20px 60px rgba(0,0,0,0.5);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Onest', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Animated BG ─── */
    body::before {
      content:'';
      position: fixed; inset:0;
      background:
        radial-gradient(ellipse 80% 50% at 15% 10%, rgba(255,90,130,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 85% 80%, rgba(0,229,212,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 50% 50%, rgba(245,200,74,0.03) 0%, transparent 70%);
      pointer-events:none; z-index:0;
    }

    body::after {
      content:'';
      position: fixed; inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events:none; z-index:0;
    }

    .wrap { position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:24px 20px 80px; }

    /* ─── Header ─── */
    .top-bar {
      display:flex; align-items:center; justify-content:space-between;
      padding: 0 0 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }
    .brand { display:flex; align-items:baseline; gap:10px; }
    .brand-name {
      font-family:'Syne', sans-serif;
      font-size:2rem; font-weight:800;
      background: linear-gradient(120deg, #fff 30%, var(--pink));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      letter-spacing:-0.02em;
    }
    .brand-sub {
      font-size:0.75rem; font-weight:500; color:var(--text3);
      letter-spacing:0.18em; text-transform:uppercase;
    }
    .top-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .btn-sm {
      padding:9px 18px; border-radius:99px; border:none; cursor:pointer;
      font-family:'Onest',sans-serif; font-size:0.82rem; font-weight:600;
      letter-spacing:0.02em; transition:all .2s;
    }
    .btn-sm:hover { transform:translateY(-1px); }
    .btn-save   { background:var(--cyan); color:#050A0E; }
    .btn-import { background:rgba(255,255,255,0.08); color:var(--text); border:1px solid var(--border); }
    .btn-logs   { background:rgba(255,255,255,0.06); color:var(--text2); border:1px solid var(--border); }

    /* ─── Music pill ─── */
    .music-pill {
      display:inline-flex; align-items:center; gap:10px;
      background:rgba(255,90,130,0.1); border:1px solid var(--border-hi);
      border-radius:99px; padding:7px 16px 7px 10px;
    }
    .music-pill button { background:none; border:none; color:var(--pink); font-size:1.1rem; cursor:pointer; line-height:1; }
    .music-pill span { font-size:0.78rem; color:var(--text2); font-family:'JetBrains Mono',monospace; }
    .music-dot {
      width:6px; height:6px; border-radius:50%; background:var(--pink);
      animation:pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(0.7)} }

    /* ─── Hero Stats Row ─── */
    .stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:24px; }
    @media(max-width:640px){ .stats-row{ grid-template-columns:1fr 1fr; } }

    .stat-card {
      background:var(--glass); backdrop-filter:blur(12px);
      border-radius:var(--radius); border:1px solid var(--border);
      padding:24px 22px; position:relative; overflow:hidden;
      transition:border-color .25s;
    }
    .stat-card:hover { border-color:rgba(255,255,255,0.14); }
    .stat-card::before {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,0.03),transparent);
      pointer-events:none;
    }
    .stat-label {
      font-size:0.68rem; font-weight:600; letter-spacing:0.14em;
      text-transform:uppercase; color:var(--text3); margin-bottom:10px;
    }
    .stat-value {
      font-family:'JetBrains Mono',monospace;
      font-size:2.1rem; font-weight:600; line-height:1;
    }
    .stat-sub { font-size:0.78rem; color:var(--text3); margin-top:8px; }
    .stat-card.pink .stat-label { color:var(--pink); }
    .stat-card.pink .stat-value { color:#fff; }
    .stat-card.pink { border-color:rgba(255,90,130,0.2); }
    .stat-card.cyan .stat-label { color:var(--cyan); }
    .stat-card.cyan .stat-value { color:#fff; }
    .stat-card.cyan { border-color:rgba(0,229,212,0.2); }
    .stat-card.gold .stat-label { color:var(--gold); }
    .stat-card.gold .stat-value { color:#fff; }
    .stat-card.gold { border-color:rgba(245,200,74,0.2); }
    .stat-glow {
      position:absolute; right:-20px; bottom:-20px;
      width:80px; height:80px; border-radius:50%; opacity:0.15; filter:blur(20px);
    }
    .pink .stat-glow  { background:var(--pink); }
    .cyan .stat-glow  { background:var(--cyan); }
    .gold .stat-glow  { background:var(--gold); }

    /* ─── Profit Panel ─── */
    .profit-panel {
      background:var(--glass); backdrop-filter:blur(12px);
      border-radius:var(--radius); border:1px solid var(--border);
      padding:24px 26px; margin-bottom:24px;
      display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:20px;
    }
    .profit-left h3 { font-size:0.68rem; color:var(--text3); letter-spacing:0.14em; text-transform:uppercase; margin-bottom:6px; }
    .profit-big {
      font-family:'JetBrains Mono',monospace;
      font-size:2.6rem; font-weight:600; color:var(--green);
    }
    .profit-meta { font-size:0.84rem; color:var(--text2); margin-top:6px; }
    .profit-meta span { color:var(--red); font-family:'JetBrains Mono',monospace; }
    .profit-right { display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
    .btn-profit, .btn-expense {
      padding:10px 20px; border-radius:99px; border:none; cursor:pointer;
      font-family:'Onest',sans-serif; font-size:0.85rem; font-weight:600;
      transition:all .2s;
    }
    .btn-profit  { background:rgba(43,255,192,0.12); color:var(--green); border:1px solid rgba(43,255,192,0.25); }
    .btn-expense { background:rgba(255,77,106,0.12); color:var(--red);   border:1px solid rgba(255,77,106,0.25); }
    .btn-profit:hover  { background:rgba(43,255,192,0.2); transform:translateY(-1px); }
    .btn-expense:hover { background:rgba(255,77,106,0.2); transform:translateY(-1px); }

    /* Expense chips */
    .expense-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
    .expense-chip {
      background:rgba(255,77,106,0.1); border:1px solid rgba(255,77,106,0.2);
      border-radius:99px; padding:5px 14px;
      font-size:0.78rem; color:var(--text2);
      font-family:'JetBrains Mono',monospace;
    }
    .expense-chip strong { color:var(--red); }

    /* ─── Add Record Button ─── */
    .add-record-btn {
      display:flex; align-items:center; gap:10px;
      background:linear-gradient(135deg, rgba(255,90,130,0.15), rgba(0,229,212,0.08));
      border:1px dashed rgba(255,90,130,0.35); border-radius:var(--radius);
      padding:16px 24px; margin-bottom:24px; cursor:pointer; width:100%;
      font-family:'Onest',sans-serif; font-size:0.95rem; font-weight:600;
      color:var(--pink); letter-spacing:0.01em; transition:all .2s;
    }
    .add-record-btn:hover { background:rgba(255,90,130,0.12); transform:translateY(-2px); }
    .add-record-btn .plus-icon {
      width:32px; height:32px; border-radius:50%; border:1.5px solid var(--pink);
      display:flex; align-items:center; justify-content:center; font-size:1.2rem;
    }

    /* ─── Record Cards ─── */
    .record-card {
      background:var(--bg3); border-radius:22px; border:1px solid var(--border);
      margin-bottom:20px; overflow:hidden; transition:border-color .25s;
    }
    .record-card:hover { border-color:rgba(255,255,255,0.1); }

    .record-head {
      display:flex; align-items:center; justify-content:space-between;
      padding:20px 24px; border-bottom:1px solid var(--border);
    }
    .record-title {
      font-family:'Syne',sans-serif; font-size:1.05rem; font-weight:700;
    }
    .record-badge {
      display:inline-flex; align-items:center; gap:6px;
      background:rgba(255,255,255,0.05); border:1px solid var(--border);
      border-radius:99px; padding:4px 12px; font-size:0.75rem; color:var(--text2);
      margin-left:12px;
    }
    .record-btns { display:flex; gap:8px; }
    .rec-btn {
      padding:7px 14px; border-radius:99px; border:none; cursor:pointer;
      font-family:'Onest',sans-serif; font-size:0.78rem; font-weight:600; transition:all .2s;
    }
    .rec-edit   { background:rgba(74,108,247,0.15); color:#7B9EFF; border:1px solid rgba(74,108,247,0.25); }
    .rec-delete { background:rgba(217,83,79,0.12); color:#FF6B6B; border:1px solid rgba(217,83,79,0.2); }
    .rec-edit:hover   { background:rgba(74,108,247,0.25); }
    .rec-delete:hover { background:rgba(217,83,79,0.2); }

    /* Progress bar */
    .record-progress-bar {
      height:3px; background:rgba(255,255,255,0.05);
    }
    .record-progress-fill {
      height:100%; background:linear-gradient(90deg,var(--pink),var(--cyan));
      transition:width .6s ease;
    }

    /* Table */
    .record-body { padding:0 24px 24px; }
    .weeks-table { width:100%; border-collapse:collapse; margin:16px 0; }
    .weeks-table th {
      font-size:0.68rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase;
      color:var(--text3); padding:10px 8px; text-align:left;
      border-bottom:1px solid var(--border);
    }
    .weeks-table td {
      padding:12px 8px; border-bottom:1px solid rgba(255,255,255,0.04);
      font-size:0.88rem;
    }
    .weeks-table tr:last-child td { border-bottom:none; }
    .week-num {
      font-family:'JetBrains Mono',monospace; font-size:0.75rem;
      color:var(--text3); background:rgba(255,255,255,0.05);
      padding:3px 9px; border-radius:99px; display:inline-block;
    }

    /* Inputs */
    .field-input {
      background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
      border-radius:9px; color:var(--text); padding:7px 11px;
      font-family:'JetBrains Mono',monospace; font-size:0.85rem;
      outline:none; transition:border-color .2s;
    }
    .field-input:focus { border-color:var(--pink); }
    .field-input.date-input { width:92px; }
    .field-input.amount-input { width:90px; }

    /* Status buttons */
    .status-row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .s-btn {
      padding:5px 12px; border-radius:99px; border:none; cursor:pointer;
      font-family:'Onest',sans-serif; font-size:0.72rem; font-weight:600;
      transition:all .15s; letter-spacing:0.02em;
    }
    .s-received { background:rgba(43,255,192,0.15); color:var(--green); border:1px solid rgba(43,255,192,0.3); }
    .s-partial   { background:rgba(245,200,74,0.15); color:var(--gold);  border:1px solid rgba(245,200,74,0.3); }
    .s-pending   { background:rgba(255,90,130,0.12); color:var(--pink);  border:1px solid rgba(255,90,130,0.25); }
    .s-btn:hover { opacity:0.8; transform:scale(0.97); }
    .missing-field {
      background:rgba(245,200,74,0.08); border:1px solid rgba(245,200,74,0.3);
      border-radius:8px; color:var(--gold); padding:5px 9px;
      font-family:'JetBrains Mono',monospace; font-size:0.82rem; width:70px; outline:none;
    }

    /* Summary row */
    .record-summary {
      display:flex; gap:12px; padding:14px 20px; margin-top:8px;
      background:rgba(0,0,0,0.2); border-radius:12px;
    }
    .sum-block { flex:1; }
    .sum-label { font-size:0.65rem; color:var(--text3); letter-spacing:0.12em; text-transform:uppercase; margin-bottom:4px; }
    .sum-value { font-family:'JetBrains Mono',monospace; font-size:1.1rem; font-weight:600; }

    /* ─── Logs Panel ─── */
    #logsPanel {
      position:fixed; top:0; right:-440px; width:440px; height:100vh;
      background:#0B0F1C; border-left:1px solid var(--border-hi);
      padding:28px 24px; overflow-y:auto; transition:right .35s cubic-bezier(.4,0,.2,1); z-index:2500;
    }
    #logsPanel.open { right:0; box-shadow:-20px 0 60px rgba(0,0,0,0.6); }
    .log-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
    .log-header h2 { font-family:'Syne',sans-serif; font-size:1.2rem; }
    .log-clear-btn { padding:7px 14px; background:rgba(255,77,106,0.15); color:var(--red); border:1px solid rgba(255,77,106,0.25); border-radius:99px; cursor:pointer; font-size:0.78rem; font-family:'Onest',sans-serif; }
    .log-entry {
      background:rgba(255,255,255,0.03); border-left:2px solid var(--pink);
      border-radius:0 10px 10px 0; padding:12px 14px; margin-bottom:10px;
    }
    .log-time { font-size:0.68rem; color:var(--text3); font-family:'JetBrains Mono',monospace; margin-bottom:4px; }
    .log-action { font-size:0.84rem; color:var(--text2); }

    /* ─── Toast ─── */
    #autoDownloadToast {
      position:fixed; bottom:28px; right:24px;
      background:#0E1420; color:var(--cyan);
      padding:12px 22px; border-radius:99px;
      box-shadow:0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px var(--border), inset 0 0 20px rgba(0,229,212,0.05);
      display:flex; align-items:center; gap:10px; z-index:4000;
      font-size:0.82rem; font-weight:600; font-family:'JetBrains Mono',monospace;
      opacity:0; transform:translateY(10px);
      transition:opacity .25s, transform .25s; pointer-events:none;
    }
    #autoDownloadToast.show { opacity:1; transform:translateY(0); }

    /* ─── Notification ─── */
    #notification {
      position:fixed; top:80px; left:24px;
      background:#0E1420; color:var(--cyan);
      padding:12px 20px; border-radius:14px;
      box-shadow:var(--shadow); border:1px solid rgba(0,229,212,0.3);
      display:none; align-items:center; gap:10px; z-index:2900;
      font-size:0.88rem;
    }

    /* ─── Modals ─── */
    .modal {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,0.8); backdrop-filter:blur(6px);
      align-items:center; justify-content:center; z-index:3000;
    }
    .modal-box {
      background:#0D1120; border:1px solid var(--border-hi);
      border-radius:24px; width:92%; max-width:440px; padding:36px 32px;
      box-shadow:0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
      animation:slideUp .25s ease;
    }
    @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal-title {
      font-family:'Syne',sans-serif; font-size:1.35rem; font-weight:700;
      margin-bottom:8px;
    }
    .modal-sep { height:1px; background:var(--border); margin:20px 0; }
    .field-label { font-size:0.72rem; color:var(--text3); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:8px; display:block; }
    .modal-input {
      width:100%; padding:13px 16px; border-radius:12px;
      background:rgba(255,255,255,0.05); border:1px solid var(--border);
      color:var(--text); font-family:'JetBrains Mono',monospace; font-size:1rem;
      outline:none; transition:border-color .2s; margin-bottom:18px;
    }
    .modal-input:focus { border-color:var(--pink); }
    .modal-select {
      width:100%; padding:13px 16px; border-radius:12px;
      background:#0D1525; border:1px solid var(--border);
      color:var(--text); font-family:'Onest',sans-serif; font-size:0.95rem;
      outline:none; margin-bottom:18px; cursor:pointer;
    }
    .modal-btns { display:flex; gap:12px; margin-top:8px; }
    .modal-btns button {
      flex:1; padding:14px; border-radius:12px; border:none; cursor:pointer;
      font-family:'Onest',sans-serif; font-weight:600; font-size:0.92rem; transition:all .2s;
    }
    .m-cancel { background:rgba(255,255,255,0.06); color:var(--text2); }
    .m-confirm { background:linear-gradient(135deg, var(--pink), #C23060); color:#fff; }
    .m-confirm:hover { opacity:0.9; transform:translateY(-1px); }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:99px; }

    /* ─── Date label ─── */
    .as-of { font-size:0.72rem; color:var(--text3); letter-spacing:0.08em; margin-top:4px; }
  </style>
</head>
<body>
  <input type="file" id="importFileInput" accept=".txt" style="display:none;" onchange="handleImportFile(event)">
  <div id="autoDownloadToast">💾 database.txt saved</div>
  <div id="notification"><span id="notificationText"></span></div>

  <!-- Logs Panel -->
  <div id="logsPanel">
    <div class="log-header">
      <h2>Activity Logs</h2>
      <button class="log-clear-btn" onclick="clearLogs()">Clear All</button>
    </div>
    <div id="logsContainer"></div>
  </div>

  <div class="wrap">
    <!-- TOP BAR -->
    <div class="top-bar">
      <div style="display:flex;align-items:center;gap:20px;">
        <div class="brand">
          <div class="brand-name">Maya</div>
          <div class="brand-sub">Savings Tracker</div>
        </div>
        <div class="music-pill">
          <button id="playBtn">⏸</button>
          <div class="music-dot"></div>
          <span>Super Shy — NewJeans</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn-sm btn-save"   onclick="manualDownload()">⬇ Save DB</button>
        <button class="btn-sm btn-import" onclick="document.getElementById('importFileInput').click()">📁 Import</button>
        <button class="btn-sm btn-logs"   onclick="toggleLogs()">📜 Logs</button>
      </div>
    </div>

    <!-- STAT CARDS -->
    <div class="stats-row">
      <div class="stat-card pink">
        <div class="stat-label">Total Savings</div>
        <div class="stat-value" id="totalSaved">₱0</div>
        <div class="as-of" id="asOfDate"></div>
        <div class="stat-glow"></div>
      </div>
      <div class="stat-card cyan">
        <div class="stat-label">Overall Profit</div>
        <div class="stat-value" id="overallProfit">₱0</div>
        <div class="as-of">Base amount</div>
        <div class="stat-glow"></div>
      </div>
      <div class="stat-card gold">
        <div class="stat-label">Total Spent</div>
        <div class="stat-value" id="totalSpent">₱0</div>
        <div class="as-of">All expenses</div>
        <div class="stat-glow"></div>
      </div>
    </div>

    <!-- PROFIT PANEL -->
    <div class="profit-panel">
      <div class="profit-left" style="flex:1;">
        <h3>Profit & Expenses</h3>
        <div class="profit-big" id="profitBig">₱0</div>
        <div class="profit-meta">Total Spent: <span id="totalSpentMeta">₱0</span></div>
        <div class="expense-chips" id="expenseChips"></div>
      </div>
      <div class="profit-right">
        <button class="btn-profit"  onclick="showEditProfitModal()">✏️ Edit Base Profit</button>
        <button class="btn-expense" onclick="showAddExpenseModal()">💸 Add Expense</button>
      </div>
    </div>

    <!-- ADD RECORD -->
    <button class="add-record-btn" onclick="showAddModal()">
      <div class="plus-icon">＋</div>
      Add New Savings Record
    </button>

    <!-- RECORDS -->
    <div id="recordsContainer"></div>
  </div>

  <audio id="bgMusic" loop><source src="Super Shy.mp3" type="audio/mpeg"></audio>

  <!-- MODALS -->
  <div class="modal" id="addModal">
    <div class="modal-box">
      <div class="modal-title">New Savings Record</div>
      <p style="color:var(--text3);font-size:0.85rem;margin-bottom:0;">Set up a new weekly savings goal.</p>
      <div class="modal-sep"></div>
      <label class="field-label">Record Name</label>
      <input type="text"   id="recordName"  class="modal-input" placeholder="Maya Savings Record…">
      <label class="field-label">Week 1 Date (MM/DD/YY)</label>
      <input type="text"   id="startDate"   class="modal-input" placeholder="05/04/26">
      <label class="field-label">Number of Weeks</label>
      <select id="numWeeks" class="modal-select">
        <option value="4">4 Weeks</option>
        <option value="3">3 Weeks</option>
        <option value="2">2 Weeks</option>
        <option value="1">1 Week</option>
      </select>
      <div class="modal-btns">
        <button class="m-cancel"  onclick="hideAddModal()">Cancel</button>
        <button class="m-confirm" onclick="addNewRecord()">Create</button>
      </div>
    </div>
  </div>

  <div class="modal" id="editModal">
    <div class="modal-box">
      <div class="modal-title">Edit Record</div>
      <div class="modal-sep"></div>
      <input type="hidden" id="editId">
      <label class="field-label">Record Name</label>
      <input type="text" id="editName"      class="modal-input">
      <label class="field-label">Week 1 Date</label>
      <input type="text" id="editStartDate" class="modal-input">
      <div class="modal-btns">
        <button class="m-cancel"  onclick="hideEditModal()">Cancel</button>
        <button class="m-confirm" onclick="saveEditRecord()">Save</button>
      </div>
    </div>
  </div>

  <div class="modal" id="editProfitModal">
    <div class="modal-box">
      <div class="modal-title">Set Base Profit</div>
      <div class="modal-sep"></div>
      <label class="field-label">Amount (₱)</label>
      <input type="number" id="profitInput" class="modal-input" min="0" step="0.01" placeholder="400">
      <div class="modal-btns">
        <button class="m-cancel"  onclick="hideEditProfitModal()">Cancel</button>
        <button class="m-confirm" onclick="saveProfitAmount()">Save</button>
      </div>
    </div>
  </div>

  <div class="modal" id="addExpenseModal">
    <div class="modal-box">
      <div class="modal-title">Record Expense</div>
      <div class="modal-sep"></div>
      <label class="field-label">Amount (₱)</label>
      <input type="number" id="expenseAmount" class="modal-input" placeholder="0.00" min="0" step="0.01">
      <label class="field-label">Description</label>
      <input type="text"   id="expenseDesc"   class="modal-input" placeholder="Food, Shopping…">
      <div class="modal-btns">
        <button class="m-cancel"  onclick="hideAddExpenseModal()">Cancel</button>
        <button class="m-confirm" onclick="addExpense()">Add</button>
      </div>
    </div>
  </div>

  <script>
    let records = [], baseProfit = 400, expenses = [], logs = [];
    let isMusicPlaying = true, autoDownloadTimer = null;
    const music = document.getElementById('bgMusic');
    const playBtn = document.getElementById('playBtn');

    // ── Helpers ──────────────────────────────────────────
    const money = n => Math.round((n + Number.EPSILON) * 100) / 100;
    const calcActual = weeks => weeks.reduce((s, w) => s + Number(w.received || 0), 0);
    const calcTotalSaved = () => records.reduce((s, r) => s + calcActual(r.weeks), 0);
    const getProfit = () => money(Number(baseProfit || 0));
    const getPHDate = () => new Date().toLocaleDateString('en-US', {timeZone:'Asia/Manila',month:'long',day:'numeric',year:'numeric'});
    const getPHTime = () => new Date().toLocaleString('en-US', {timeZone:'Asia/Manila',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});

    // ── Music ─────────────────────────────────────────────
    function tryPlayMusic() { music.play().catch(() => {}); }
    playBtn.addEventListener('click', () => {
      if (isMusicPlaying) { music.pause(); playBtn.textContent = '▶'; }
      else { music.play(); playBtn.textContent = '⏸'; }
      isMusicPlaying = !isMusicPlaying;
    });

    // ── Logs ─────────────────────────────────────────────
    function addLog(action) {
      logs.unshift({ time: getPHTime(), action });
      if (logs.length > 100) logs.pop();
      localStorage.setItem('mayaLogs', JSON.stringify(logs));
      renderLogs();
    }
    function renderLogs() {
      const c = document.getElementById('logsContainer');
      c.innerHTML = logs.length
        ? logs.map(l => `<div class="log-entry"><div class="log-time">${l.time}</div><div class="log-action">${l.action}</div></div>`).join('')
        : '<p style="color:var(--text3);text-align:center;padding:30px;">No logs yet</p>';
    }
    function toggleLogs() { document.getElementById('logsPanel').classList.toggle('open'); }
    function clearLogs() {
      if (!confirm('Clear all logs?')) return;
      logs = []; localStorage.setItem('mayaLogs', '[]'); renderLogs(); triggerAutoDownload();
    }

    // ── Notifications ─────────────────────────────────────
    function showNotification(msg) {
      const n = document.getElementById('notification');
      document.getElementById('notificationText').innerHTML = msg;
      n.style.display = 'flex';
      setTimeout(() => { n.style.opacity='0'; setTimeout(()=>{ n.style.display='none'; n.style.opacity='1'; },300); }, 2500);
    }

    // ── Download ──────────────────────────────────────────
    function buildDatabase() {
      return JSON.stringify({
        savedAt: new Date().toLocaleString('en-US',{timeZone:'Asia/Manila'}),
        baseProfit, overallProfit: getProfit(), records,
        expenses: expenses.map(e=>({amount:e.amount,note:e.note||e.desc||'Expense',time:e.time||''})),
        logs: logs.map(l=>({time:l.time,action:l.action.replace(/<[^>]*>/g,'')}))
      }, null, 2);
    }
    function doDownload() {
      const a = Object.assign(document.createElement('a'), {
        href: URL.createObjectURL(new Blob(['\uFEFF'+buildDatabase()],{type:'text/plain;charset=utf-8'})),
        download: 'database.txt'
      });
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    function manualDownload() { doDownload(); showAutoDownloadToast(); }
    function triggerAutoDownload() {
      clearTimeout(autoDownloadTimer);
      autoDownloadTimer = setTimeout(() => { doDownload(); showAutoDownloadToast(); }, 1500);
    }
    function showAutoDownloadToast() {
      const t = document.getElementById('autoDownloadToast');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Import ────────────────────────────────────────────
    function handleImportFile(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const db = JSON.parse(e.target.result.trim());
          records = (db.records||[]).map(r=>({...r, weeks:r.weeks.map(w=>({...w,target:+w.target||0,received:+w.received||0,missing:+w.missing||0}))}));
          baseProfit = money(db.baseProfit ?? 400);
          expenses = (db.expenses||[]).map(ex=>({amount:money(ex.amount||0),note:ex.note||ex.desc||'Expense',time:ex.time||''}));
          logs = db.logs||[];
          saveData(); document.getElementById('asOfDate').textContent = `As of ${getPHDate()}`;
          renderAllRecords(); showNotification(`✅ Loaded "${file.name}"`);
          addLog(`Imported data from <strong>${file.name}</strong>`);
        } catch(err) { alert('❌ Failed to read file.'); }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    // ── Data ──────────────────────────────────────────────
    function saveData() {
      localStorage.setItem('mayaSavingsRecords', JSON.stringify(records));
      localStorage.setItem('mayaBaseProfit', baseProfit);
      localStorage.setItem('mayaExpenses', JSON.stringify(expenses));
    }
    function loadData() {
      const sr = localStorage.getItem('mayaSavingsRecords');
      if (sr) records = JSON.parse(sr).map(r=>({...r,weeks:r.weeks.map(w=>({...w,target:+w.target||0,received:+w.received||0,missing:+w.missing||0}))}));
      else records = [
        {id:1,name:'Maya Savings Record 1',startDate:'04/01/26',weeks:Array(4).fill(null).map((_,i)=>({week:i+1,target:100,received:100,status:'success',missing:0,date:''}))},
        {id:2,name:'Maya Savings Record 2',startDate:'04/20/26',weeks:Array(4).fill(null).map((_,i)=>({week:i+1,target:100,received:0,status:'pending',missing:0,date:''}))},
        {id:3,name:'Maya Savings Record 3',startDate:'05/18/26',weeks:Array(4).fill(null).map((_,i)=>({week:i+1,target:100,received:0,status:'pending',missing:0,date:''}))},
        {id:4,name:'Maya Savings Record 4',startDate:'06/15/26',weeks:Array(4).fill(null).map((_,i)=>({week:i+1,target:100,received:0,status:'pending',missing:0,date:''}))},
      ];
      const sp = localStorage.getItem('mayaBaseProfit');
      if (sp !== null) baseProfit = money(parseFloat(sp));
      const se = localStorage.getItem('mayaExpenses');
      if (se) expenses = JSON.parse(se).map(ex=>({...ex,amount:money(ex.amount||0)}));
      const sl = localStorage.getItem('mayaLogs');
      if (sl) logs = JSON.parse(sl);
      document.getElementById('asOfDate').textContent = `As of ${getPHDate()}`;
      renderAllRecords(); renderLogs(); tryPlayMusic();
    }

    // ── Render ────────────────────────────────────────────
    function formatDate(base, weekNum, custom='') {
      if (custom) return custom;
      try {
        const [m,d,y] = base.split('/').map(Number);
        const dt = new Date(2000+y,m-1,d); dt.setDate(dt.getDate()+(weekNum-1)*7);
        return dt.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'2-digit'});
      } catch(e) { return '—'; }
    }

    function statusChips(recordId, week) {
      let h = `<div class="status-row">
        <button class="s-btn s-received" onclick="setStatus(${recordId},${week.week},'success')">✓ Received</button>
        <button class="s-btn s-partial"   onclick="setStatus(${recordId},${week.week},'warning')">⚡ Partial</button>
        <button class="s-btn s-pending"  onclick="setStatus(${recordId},${week.week},'pending')">⏳ Pending</button>`;
      if (week.status==='warning')
        h += `<input type="number" class="missing-field" value="${week.missing||0}" onchange="updateMissing(${recordId},${week.week},this.value)">`;
      return h + '</div>';
    }

    function renderRecord(record) {
      const actual   = calcActual(record.weeks);
      const expected = record.weeks.length * 100;
      const pct = Math.round(Math.min(actual/expected,1)*100);
      let rows = '';
      record.weeks.forEach(w => {
        const dateVal = w.date || formatDate(record.startDate, w.week);
        rows += `<tr>
          <td><span class="week-num">W${w.week}</span></td>
          <td><input type="text"   class="field-input date-input"   value="${dateVal}"    onchange="updateWeekDate(${record.id},${w.week},this.value)"></td>
          <td style="font-family:'JetBrains Mono',monospace;color:var(--text3)">₱${w.target}</td>
          <td><input type="number" class="field-input amount-input" value="${w.received}" onchange="updateReceived(${record.id},${w.week},this.value)"></td>
          <td>${statusChips(record.id,w)}</td>
        </tr>`;
      });
      return `
        <div class="record-card">
          <div class="record-head">
            <div style="display:flex;align-items:center;gap:4px;">
              <span class="record-title">${record.name}</span>
              <span class="record-badge">${pct}% complete</span>
            </div>
            <div class="record-btns">
              <button class="rec-btn rec-edit"   onclick="editRecord(${record.id})">Edit</button>
              <button class="rec-btn rec-delete" onclick="deleteRecord(${record.id})">Delete</button>
            </div>
          </div>
          <div class="record-progress-bar"><div class="record-progress-fill" style="width:${pct}%"></div></div>
          <div class="record-body">
            <table class="weeks-table">
              <tr><th>Week</th><th>Date</th><th>Target</th><th>Received</th><th>Status</th></tr>
              ${rows}
            </table>
            <div class="record-summary">
              <div class="sum-block"><div class="sum-label">Expected</div><div class="sum-value">₱${expected}</div></div>
              <div class="sum-block"><div class="sum-label">Actual</div><div class="sum-value" style="color:${actual>=expected?'var(--green)':'var(--text)'}">₱${actual}</div></div>
              <div class="sum-block"><div class="sum-label">Progress</div><div class="sum-value" style="color:var(--gold)">${pct}%</div></div>
            </div>
          </div>
        </div>`;
    }

    function renderAllRecords() {
      document.getElementById('recordsContainer').innerHTML = records.map(renderRecord).join('');
      document.getElementById('totalSaved').textContent = `₱${calcTotalSaved()}`;
      renderExpenses();
    }

    function renderExpenses() {
      const totalSpent = money(expenses.reduce((s,e)=>s+(e.amount||0),0));
      const profit = getProfit();
      document.getElementById('overallProfit').textContent = `₱${profit}`;
      document.getElementById('profitBig').textContent = `₱${profit}`;
      document.getElementById('totalSpent').textContent = `₱${totalSpent}`;
      document.getElementById('totalSpentMeta').textContent = `₱${totalSpent}`;
      document.getElementById('expenseChips').innerHTML = expenses.slice(0,6).map(e =>
        `<div class="expense-chip">${e.note} <strong>-₱${e.amount}</strong></div>`
      ).join('');
    }

    // ── Actions ───────────────────────────────────────────
    function updateReceived(id, wn, val) {
      const r=records.find(r=>r.id===id), w=r?.weeks.find(w=>w.week===wn); if(!w) return;
      w.received=money(parseFloat(val)||0); saveData(); renderAllRecords();
      showNotification(`Week ${wn} updated`);
      addLog(`Updated Week ${wn} received to ₱${w.received} in <strong>${r.name}</strong>`);
      triggerAutoDownload();
    }
    function updateWeekDate(id, wn, v) {
      const r=records.find(r=>r.id===id), w=r?.weeks.find(w=>w.week===wn); if(!w) return;
      w.date=v.trim(); saveData(); renderAllRecords(); triggerAutoDownload();
    }
    function updateMissing(id, wn, val) {
      const r=records.find(r=>r.id===id), w=r?.weeks.find(w=>w.week===wn); if(!w) return;
      w.missing=money(parseFloat(val)||0); w.received=money(w.target-w.missing);
      saveData(); renderAllRecords(); triggerAutoDownload();
    }
    function setStatus(id, wn, status) {
      const r=records.find(r=>r.id===id), w=r?.weeks.find(w=>w.week===wn); if(!w) return;
      w.status=status;
      if(status==='success'){ w.received=w.target; w.missing=0; }
      else if(status==='pending'){ w.received=0; w.missing=0; }
      else if(status==='warning'){ if(!w.missing) w.missing=100; w.received=money(w.target-w.missing); }
      saveData(); renderAllRecords();
      showNotification(`Week ${wn} → ${status}`);
      addLog(`Set Week ${wn} to <strong>${status}</strong> in <strong>${r.name}</strong>`);
      triggerAutoDownload();
    }

    // ── Add modal ─────────────────────────────────────────
    function getNextMonday() {
      const now=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Manila'}));
      let d=(1-now.getDay()+7)%7; if(!d)d=7;
      const nx=new Date(now); nx.setDate(now.getDate()+d);
      return nx.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'2-digit'});
    }
    function showAddModal() {
      document.getElementById('startDate').value = getNextMonday();
      document.getElementById('recordName').value = `Maya Savings Record ${records.length+1}`;
      document.getElementById('addModal').style.display='flex';
    }
    function hideAddModal() { document.getElementById('addModal').style.display='none'; }
    function addNewRecord() {
      const name=document.getElementById('recordName').value.trim()||`Record ${records.length+1}`;
      const start=document.getElementById('startDate').value.trim()||getNextMonday();
      const nw=parseInt(document.getElementById('numWeeks').value);
      records.push({id:Date.now(),name,startDate:start,
        weeks:Array.from({length:nw},(_,i)=>({week:i+1,target:100,received:0,status:'pending',missing:0,date:''}))});
      saveData(); renderAllRecords(); hideAddModal();
      showNotification(`Record "${name}" created`);
      addLog(`Created <strong>${name}</strong>`); triggerAutoDownload();
    }

    // ── Edit record modal ──────────────────────────────────
    function editRecord(id) {
      const r=records.find(r=>r.id===id); if(!r) return;
      document.getElementById('editId').value=r.id;
      document.getElementById('editName').value=r.name;
      document.getElementById('editStartDate').value=r.startDate;
      document.getElementById('editModal').style.display='flex';
    }
    function hideEditModal() { document.getElementById('editModal').style.display='none'; }
    function saveEditRecord() {
      const id=parseInt(document.getElementById('editId').value);
      const r=records.find(r=>r.id===id); if(!r) return;
      r.name=document.getElementById('editName').value.trim()||r.name;
      r.startDate=document.getElementById('editStartDate').value.trim()||r.startDate;
      saveData(); renderAllRecords(); hideEditModal();
      showNotification('Record updated'); addLog(`Edited <strong>${r.name}</strong>`); triggerAutoDownload();
    }
    function deleteRecord(id) {
      const r=records.find(r=>r.id===id);
      if(!confirm(`Delete "${r?.name}"?`)) return;
      addLog(`Deleted <strong>${r.name}</strong>`);
      records=records.filter(r=>r.id!==id); saveData(); renderAllRecords();
      showNotification('Record deleted'); triggerAutoDownload();
    }

    // ── Profit modal ──────────────────────────────────────
    function showEditProfitModal() { document.getElementById('profitInput').value=baseProfit; document.getElementById('editProfitModal').style.display='flex'; }
    function hideEditProfitModal() { document.getElementById('editProfitModal').style.display='none'; }
    function saveProfitAmount() {
      const v=parseFloat(document.getElementById('profitInput').value.trim());
      if(isNaN(v)||v<0){ showNotification('❌ Invalid amount'); return; }
      baseProfit=money(v); saveData(); renderExpenses(); hideEditProfitModal();
      showNotification(`✅ Base Profit → ₱${v}`);
      addLog(`Set base profit to <strong>₱${v}</strong>`); triggerAutoDownload();
    }

    // ── Expense modal ─────────────────────────────────────
    function showAddExpenseModal() {
      document.getElementById('expenseAmount').value='';
      document.getElementById('expenseDesc').value='';
      document.getElementById('addExpenseModal').style.display='flex';
    }
    function hideAddExpenseModal() { document.getElementById('addExpenseModal').style.display='none'; }
    function addExpense() {
      const amt=money(parseFloat(document.getElementById('expenseAmount').value));
      const note=document.getElementById('expenseDesc').value.trim()||'Expense';
      if(!amt||amt<=0){ alert('Please enter a valid amount'); return; }
      expenses.unshift({amount:amt,note,time:getPHTime()});
      saveData(); renderAllRecords(); hideAddExpenseModal();
      showNotification(`₱${amt} spent recorded`);
      addLog(`Spent ₱${amt} (${note})`); triggerAutoDownload();
    }

    window.onload = loadData;
  </script>
</body>
</html>
